# DDPM config used for DDPM training
ddpm:
  data:
    root: '/Users/jorgegoncalves/Desktop/Repositories/Master_Thesis/treevae/data/celeba/img_align_celeba'
    name: "celeba"
    image_size: 64
    hflip: True
    n_channels: 3
    norm: True
    ddpm_latent_path: ""

  model:
    dim : 128
    attn_resolutions: "16,"
    n_residual: 2
    dim_mults: "1,2,2,2,4"
    dropout: 0.1
    n_heads: 8
    beta1: 0.0001
    beta2: 0.02
    n_timesteps: 1000

  evaluation:
    chkpt_path: '../../../pretrained_models/celeba/diffvae_celeba64_form1_loss=0.0146.ckpt'
    save_path: 'results/celeba/'
    z_cond: False
    z_dim: 512
    guidance_weight: 0.0
    type: 'form1'
    resample_strategy: "spaced"
    skip_strategy: "uniform"
    sample_method: "ddim"
    sample_from: "target"
    seed: 0
    device: "gpu:0"
    n_samples: 10000
    n_steps: 100
    workers: 2
    batch_size: 32
    save_vae: True
    variance: "fixedlarge"
    sample_prefix: ""
    temp: 1.0
    save_mode: image
  
  interpolation:
    n_steps: 10

# VAE config used for VAE training
vae:
  data:
    root: '/Users/jorgegoncalves/Desktop/Repositories/Master_Thesis/treevae/data/celeba/img_align_celeba'
    name: "celeba"
    image_size: 64
    n_channels: 3

  model:
    z_dim: 512
    enc_block_config : "64x7,64d2,64t32,32x4,32d2,32t16,16x7,16d2,16t8,8x3,8d2,8t4,4x3,4d4,4t1,1x2"
    enc_channel_config: "64:64,32:128,16:256,8:256,4:256,1:512"
    dec_block_config: "1x1,1u4,1t4,4x2,4u2,4t8,8x3,8u2,8t16,16x7,16u2,16t32,32x8,32u2,32t64,64x10"
    dec_channel_config: "64:64,32:128,16:256,8:256,4:256,1:512"

  evaluation:
    chkpt_path: '../../../pretrained_models/celeba/vae_celeba64_loss=0.0000.ckpt'
    save_path: 'results/'
    expde_model_path: ""
    seed: 0
    device: "gpu:0"
    workers: 2
    batch_size: 32
    n_samples: 10000
    sample_prefix: ""
    save_mode: image
